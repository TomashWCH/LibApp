name: Codzienna synchronizacja Librus

# Synchronizacja 3 razy dziennie, o stałej porze czasu polskiego:
#   rano       ok. 7:07   (okno 6:30–7:30)
#   po południu ok. 16:37 (okno 16:00–17:00)
#   wieczorem  ok. 19:37
# GitHub liczy harmonogram w UTC, a czas w Polsce zmienia się (zima/lato), dlatego
# każda pora ma dwa wpisy cron, a zadanie "gate" uruchamia synchronizację tylko
# wtedy, gdy w Polsce jest właściwa godzina. Drugi wpis danej pory jest pomijany.
on:
  schedule:
    - cron: "7 5 * * *"   # 7:07 latem (CEST) / 6:07 zimą — zimą pomijane
    - cron: "7 6 * * *"   # 8:07 latem — pomijane / 7:07 zimą (CET)
    - cron: "37 14 * * *" # 16:37 latem (CEST) / 15:37 zimą — zimą pomijane
    - cron: "37 15 * * *" # 17:37 latem — pomijane / 16:37 zimą (CET)
    - cron: "37 17 * * *" # 19:37 latem (CEST) / 18:37 zimą — zimą pomijane
    - cron: "37 18 * * *" # 20:37 latem — pomijane / 19:37 zimą (CET)
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki "Actions" w GitHubie

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Sprawdzenie pory (czas polski)
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          echo "Czas w Polsce: $(TZ=Europe/Warsaw date +%H:%M)"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$HOUR" = "07" ] || [ "$HOUR" = "16" ] || [ "$HOUR" = "19" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "To nie ta pora — pomijam synchronizację."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalacja zależności
        run: npm install

      - name: Synchronizacja Librusa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIBRUS_LOGIN_DZIECKO1: ${{ secrets.LIBRUS_LOGIN_DZIECKO1 }}
          LIBRUS_PASSWORD_DZIECKO1: ${{ secrets.LIBRUS_PASSWORD_DZIECKO1 }}
          LIBRUS_LOGIN_DZIECKO2: ${{ secrets.LIBRUS_LOGIN_DZIECKO2 }}
          LIBRUS_PASSWORD_DZIECKO2: ${{ secrets.LIBRUS_PASSWORD_DZIECKO2 }}
        run: npm run sync

      # --- Moduł WhatsApp: podsumowanie wybranych grup ---
      # Działa niezależnie od Librusa (if: always()) i jego błąd nie psuje całego przebiegu
      # (continue-on-error) — status widać w appce, na pulpicie w karcie WhatsApp.
      - name: Node.js 22 dla modułu WhatsApp
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalacja zależności modułu WhatsApp
        if: always()
        continue-on-error: true
        working-directory: whatsapp
        run: npm install

      - name: Podsumowanie grup WhatsApp
        if: always()
        continue-on-error: true
        working-directory: whatsapp
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_GROUPS: ${{ secrets.WHATSAPP_GROUPS }}
        run: npm run sync

      # --- Powiadomienia push: nowe oceny/uwagi/terminy + podsumowania (7:xx dziś, 19:xx jutro/tydzień) ---
      - name: Instalacja zależności modułu powiadomień
        if: always()
        continue-on-error: true
        working-directory: notify
        run: npm install

      - name: Powiadomienia
        if: always()
        continue-on-error: true
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run notify
