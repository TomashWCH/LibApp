<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Podsumowanie" />
<title>Podsumowanie dnia</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1517" media="(prefers-color-scheme: dark)" />
<style>
  :root {
    --bg: #eef2f1;
    --card: #ffffff;
    --ink: #14232b;
    --muted: #5c6b72;
    --line: rgba(20, 35, 43, 0.1);
    --accent: #0d7c86;
    --on-accent: #ffffff;
    --ok: #1f9d55;
    --err: #d64545;
    --warn: #b7791f;
    --warn-soft: #f7e8cc;
    --err-soft: #f8dcdc;
    --ok-soft: #d8efe1;
    --c0: #0d7c86; --c0-soft: #d9eef0;
    --c1: #8a3a72; --c1-soft: #f2e0ec;
    --c2: #b26a00; --c2-soft: #f7e8cc;
    --g4: #2563b8; --g4-soft: #dbe8fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1517;
      --card: #162126;
      --ink: #eaf1f2;
      --muted: #97a8ad;
      --line: rgba(234, 241, 242, 0.12);
      --accent: #4cc3cf;
      --on-accent: #06181b;
      --ok: #4cc98a;
      --err: #f08080;
      --warn: #f0b04a;
      --warn-soft: #3a2c12;
      --err-soft: #3d1f1f;
      --ok-soft: #14352a;
      --c0: #4cc3cf; --c0-soft: #17393d;
      --c1: #e08fc4; --c1-soft: #3a2133;
      --c2: #f0b04a; --c2-soft: #3a2c12;
      --g4: #7db2ff; --g4-soft: #1b2c47;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    line-height: 1.45;
  }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; }
  .c0 { --ch: var(--c0); --ch-soft: var(--c0-soft); }
  .c1 { --ch: var(--c1); --ch-soft: var(--c1-soft); }
  .c2 { --ch: var(--c2); --ch-soft: var(--c2-soft); }

  /* logowanie */
  #login-screen { text-align: center; padding: 72px 24px; max-width: 420px; margin: 0 auto; }
  #login-screen h1 { font-size: 1.6rem; }
  #login-screen p { color: var(--muted); margin-top: 8px; }
  .btn {
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px;
    padding: 12px 18px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  #login-btn { margin-top: 28px; width: 100%; }
  .btn-quiet { background: transparent; color: var(--muted); font-weight: 500; width: 100%; padding: 14px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* aplikacja */
  #app-screen { display: none; }
  header { padding: 18px 16px 6px; max-width: 640px; margin: 0 auto; }
  header h1 { font-size: 1.35rem; }
  .sync-status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.error { background: var(--err); }
  .dot.pending { background: var(--muted); }
  main { padding: 8px 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
  h2.sec { font-size: 0.95rem; font-weight: 600; color: var(--muted); margin: 22px 2px 10px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 0.72rem; color: var(--muted); }

  .tile {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--ch);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
  }
  .tile-head { display: flex; align-items: center; gap: 10px; }
  .tile-head strong { font-size: 1.05rem; flex: 1; }
  .tile-head .chev { color: var(--muted); font-size: 1.3rem; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--ch-soft); color: var(--ch); font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sum { white-space: pre-line; color: var(--ink); margin-top: 10px; font-size: 0.95rem; }
  .counts { display: flex; gap: 14px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; margin-bottom: 12px; }

  .child-head { display: flex; align-items: center; gap: 12px; margin: 10px 2px 14px; }
  .child-head .avatar { width: 44px; height: 44px; font-size: 1.1rem; }
  .child-head h2 { font-size: 1.3rem; }
  .child-head small { display: block; color: var(--muted); font-size: 0.8rem; }

  .sect-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sect-title h3 { font-size: 1rem; }
  .badge { font-size: 0.75rem; background: var(--ch-soft, var(--line)); color: var(--ch, var(--muted)); padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 4px 0 2px; }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.rows li:first-child { border-top: 0; }
  ul.rows .main { flex: 1; min-width: 0; }
  ul.rows b { font-weight: 600; display: block; overflow-wrap: anywhere; }
  ul.rows small { color: var(--muted); font-size: 0.8rem; }
  .grade { min-width: 38px; height: 38px; border-radius: 10px; background: var(--ch-soft); color: var(--ch); font-weight: 700; font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .chip { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); font-weight: 600; white-space: nowrap; }
  .chip.neg { background: var(--err-soft); color: var(--err); }
  .chip.pos { background: var(--ok-soft); color: var(--ok); }
  .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .read { width: 8px; height: 8px; border-radius: 50%; background: transparent; border: 1px solid var(--line); flex: none; }
  .tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--ch-soft); color: var(--ch); margin-right: 6px; }
  .add { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 6px 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .add:disabled { opacity: 0.6; cursor: default; }
  .added { color: var(--ok); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

  /* kalendarz */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
  .cal-head h2 { font-size: 1.15rem; text-transform: capitalize; }
  .cal-head .navbtns { display: flex; gap: 6px; }
  .cal-btn { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 40px; height: 38px; padding: 0 12px; cursor: pointer; font-size: 1.1rem; }
  .cal-btn.txt { font-size: 0.85rem; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal-dow { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 4px 0; font-weight: 600; }
  .cal-day { position: relative; min-height: 50px; padding: 6px 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-variant-numeric: tabular-nums; text-align: center; }
  .cal-day.off { opacity: 0.45; }
  .cal-day.today { border-color: var(--accent); border-width: 2px; padding: 5px 0 13px; font-weight: 700; }
  .cal-day.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .cal-day .dots { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 3px; }
  .dot-c { width: 6px; height: 6px; border-radius: 50%; background: var(--ch); }
  .cal-day.sel .dot-c { background: var(--on-accent); }
  .legend { display: flex; gap: 16px; font-size: 0.82rem; color: var(--muted); margin: 12px 2px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .wa-entry { padding: 10px 0; border-top: 1px solid var(--line); }
  .wa-entry:first-of-type { border-top: 0; }
  .wa-entry small { color: var(--muted); font-size: 0.8rem; display: block; margin-bottom: 4px; }
  .wa-entry p { white-space: pre-line; }
  .wa-list { margin: 8px 0 0; padding-left: 18px; font-size: 0.92rem; }
  .wa-list li { padding: 1px 0; }
  .wa-list.todo { list-style: none; padding-left: 2px; }
  .wa-list.todo li::before { content: "☐ "; color: var(--ch, var(--accent)); }
  .wa-h { font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 0.8rem; font-weight: 400; }
  /* dziś / jutro, zadania, plan lekcji */
  .check { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--ch, var(--accent)); padding: 4px; min-width: 40px; min-height: 40px; flex: none; }
  ul.rows li s { color: var(--muted); }
  details.plan { border-top: 1px solid var(--line); }
  details.plan:first-of-type { border-top: 0; }
  details.plan summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 0.92rem; }
  ul.lessons { list-style: none; margin: 0 0 8px; padding: 0; }
  ul.lessons li { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 0.92rem; }
  ul.lessons .nr { width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--muted); font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  ul.lessons .flag { color: var(--warn); font-weight: 600; }
  .lucky { margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
  .nb { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--err); color: #fff; font-size: 0.65rem; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; }
  /* oceny */
  .gc { font-style: normal; font-size: 0.78rem; font-weight: 700; min-width: 26px; text-align: center; padding: 2px 6px; border-radius: 8px; display: inline-block; font-variant-numeric: tabular-nums; }
  .gc.g5 { background: var(--ok-soft); color: var(--ok); }
  .gc.g4 { background: var(--g4-soft); color: var(--g4); }
  .gc.g3 { background: var(--warn-soft); color: var(--warn); }
  .gc.g2 { background: var(--err-soft); color: var(--err); }
  .gc.g0 { background: var(--line); color: var(--muted); }
  .gc.new { box-shadow: 0 0 0 2px var(--ch, var(--accent)); }
  .gc.fin { border: 1px dashed currentColor; }
  .avg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .avg-head .big { font-size: 2.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .avg-head small { color: var(--muted); }
  .delta.up { color: var(--ok); } .delta.down { color: var(--err); }
  .delta { font-size: 0.8rem; font-weight: 600; }
  .seg { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  .seg button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ch-soft); color: var(--ch); border-color: transparent; font-weight: 700; }
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .lbl { fill: var(--muted); font-size: 10px; }
  svg.chart .line { fill: none; stroke: var(--ch, var(--accent)); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .pt { fill: var(--card); stroke: var(--ch, var(--accent)); stroke-width: 2; }
  svg.chart .pt.last { fill: var(--ch, var(--accent)); }
  svg.chart .val { fill: var(--ink); font-size: 11px; font-weight: 700; }
  details.subj { border-top: 1px solid var(--line); }
  details.subj > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  details.subj > summary::-webkit-details-marker { display: none; }
  details.subj .sn { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  details.subj .sa { min-width: 58px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  details.subj .sg { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; }
  details.subj ul.rows { padding-bottom: 6px; }
  .newstrip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0 2px; font-size: 0.85rem; color: var(--muted); }
  .tile-grades { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .avgbadge { font-size: 0.85rem; font-weight: 700; background: var(--ch-soft); color: var(--ch); padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .pair-code { font-size: 2rem; font-weight: 700; letter-spacing: 0.14em; text-align: center; font-variant-numeric: tabular-nums; padding: 14px 8px; margin: 10px 0; border-radius: 12px; background: var(--bg); border: 1px dashed var(--line); user-select: all; }
  .wa-groups { margin: 8px 0 0; padding: 0; list-style: none; font-size: 0.9rem; color: var(--muted); }
  .wa-groups li { padding: 2px 0; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-inner { display: flex; width: 100%; max-width: 640px; }
  nav button {
    position: relative; flex: 1; min-width: 0; background: transparent; border: 0; padding: 8px 2px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 0.7rem; color: var(--muted);
  }
  nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
  nav .ico { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem; background: transparent; }
  nav .ico.av { background: var(--ch-soft); color: var(--ch); font-weight: 700; font-size: 0.9rem; }
  nav button[aria-current="page"] .ico { box-shadow: 0 0 0 2px var(--ch, var(--accent)); }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem;
    max-width: calc(100% - 32px); z-index: 20; display: none; text-align: center;
  }
  #toast.err { background: var(--err); color: #fff; }
  @media (prefers-reduced-motion: no-preference) {
    nav button { transition: color 0.15s; }
  }

  /* ===== układ mobilny: czytelne listy, większe cele dotyku ===== */
  html { -webkit-tap-highlight-color: transparent; }
  button, summary { touch-action: manipulation; }
  body { font-size: 15px; }
  header { padding: 16px 14px 4px; }
  main { padding: 6px 12px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .card { padding: 12px 14px; border-radius: 14px; margin-bottom: 10px; }
  h2.sec { font-size: 0.82rem; letter-spacing: 0.02em; margin: 18px 4px 8px; }
  .cap1::first-letter { text-transform: uppercase; }
  ul.rows li { padding: 10px 0; gap: 10px; }
  ul.rows b, ul.lessons b { display: block; font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  ul.rows small, ul.lessons small { display: block; margin-top: 2px; font-size: 0.8rem; color: var(--muted); line-height: 1.35; }
  .add { padding: 8px 12px; font-size: 0.85rem; min-height: 40px; }
  .added { font-size: 0.82rem; }

  /* oceny */
  .avg-head { align-items: center; }
  .avg-head h3 { font-size: 1.05rem; }
  .avg-head .big { font-size: 2rem; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 6px; }
  .seg button { min-height: 40px; padding: 6px 4px; font-size: 0.85rem; }
  .gc { font-size: 0.9rem; min-width: 32px; padding: 3px 8px; border-radius: 9px; }
  .avgpill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .avgpill.g5 { background: var(--ok-soft); color: var(--ok); }
  .avgpill.g4 { background: var(--g4-soft); color: var(--g4); }
  .avgpill.g3 { background: var(--warn-soft); color: var(--warn); }
  .avgpill.g2 { background: var(--err-soft); color: var(--err); }
  .avgpill.g0 { background: var(--line); color: var(--muted); }
  .sub-hd { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 2px; }
  ul.rows.newg li { padding: 8px 0; }
  details.subj > summary { display: grid; grid-template-columns: 1fr auto 16px; grid-template-areas: "name avg chev" "chips chips chips"; column-gap: 10px; row-gap: 8px; align-items: center; padding: 12px 0; }
  details.subj .sn { grid-area: name; font-size: 0.98rem; }
  details.subj .sa { grid-area: avg; min-width: 0; }
  details.subj .sg { grid-area: chips; max-width: none; justify-content: flex-start; gap: 6px; }
  details.subj > summary::after { content: "›"; grid-area: chev; color: var(--muted); font-size: 1.4rem; line-height: 1; transform: rotate(90deg); justify-self: center; }
  details.subj[open] > summary::after { transform: rotate(-90deg); }

  /* kafel dziecka na pulpicie */
  .tile { padding: 12px 14px; }
  .tile-grades { display: block; margin-top: 10px; }
  .tile-grades .avgbadge { display: inline-block; margin-bottom: 4px; }
  .tg-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
  .tg-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg-row .d { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .counts { gap: 12px; flex-wrap: wrap; }

  .sa { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .ta { display: inline-block; width: 14px; text-align: center; }
  .od { color: var(--err); font-weight: 700; }
  ul.rows.newg .gc, .tg-row .gc { min-width: 40px; text-align: center; }
  .tg-row .d { min-width: 74px; text-align: right; }

  /* dolny pasek: etykiety w jednej linii */
  nav button { font-size: 0.66rem; white-space: nowrap; letter-spacing: -0.01em; }
  nav button[aria-current="page"] { font-weight: 600; }

  .calc { font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; overflow-wrap: anywhere; }

  /* plan lekcji */
  details.plan summary { padding: 12px 0; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Podsumowanie dnia</h1>
  <p>Librus dla obojga dzieci w jednym miejscu.</p>
  <button id="login-btn" class="btn">Zaloguj się przez Google</button>
</div>

<div id="app-screen">
  <header>
    <h1 id="greeting">Cześć!</h1>
    <div class="sync-status">
      <span class="dot pending" id="sync-dot"></span>
      <span id="sync-text">Wczytywanie…</span>
    </div>
  </header>
  <main id="content"></main>
  <nav aria-label="Widoki"><div class="nav-inner" id="nav"></div></nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, reauthenticateWithPopup, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getFirestore, doc, onSnapshot, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtDate(s) {
    if (!s) return "";
    if (!isoDate.test(s)) return esc(s);
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "short" });
  }
  function fmtStamp(ts) {
    return ts?.toDate?.().toLocaleString("pl-PL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) ?? "";
  }
  function addMinutes(date, time, mins) {
    const [y, mo, d] = date.split("-").map(Number);
    const [h, mi] = time.split(":").map(Number);
    const t = new Date(Date.UTC(y, mo - 1, d, h, mi + mins));
    return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}T${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:00`;
  }
  function addDays(date, n) {
    const [y, mo, d] = date.split("-").map(Number);
    const t = new Date(Date.UTC(y, mo - 1, d + n));

  function cyrb53(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {

  }

  function getChildren(d) {

  // Terminy z Librusa + terminy wykryte w grupie WhatsApp (bez duplikatów).
  function allEvents(c) {
    const out = [...arr(c.sections?.events)];
    const seen = new Set(out.map((e) => `${e.title}|${e.date}|${e.time || ""}`));
    for (const en of arr(c.wa?.entries)) {
      for (const ev of arr(en.events)) {
        const key = `${ev.title}|${ev.date}|${ev.time || ""}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const note = ev.sourceNote && ev.sourceNote !== "WhatsApp" ? `WhatsApp: ${ev.sourceNote}` : "WhatsApp";

  // ---------- widoki ----------
  function eventRow(ev, child, showTag) {
    const key = `${child.key}|${ev.title}|${ev.date}|${ev.time || ""}`;
    const id = "lib" + cyrb53(key).toString(32);

      </div>
      ${added ? `<span class="added">✓ Dodano</span>` : canAdd ? `<button class="add" data-add="${id}">📅 Dodaj</button>` : ""}
    </li>`;
  }

  function syncLine(d) {
    const sy = d?.whatsapp?.sync;
    if (!sy) return `<p style="color:var(--muted);font-size:0.85rem;margin-top:8px">Podsumowania grup pojawią się po następnej synchronizacji (wymaga sekretu WHATSAPP_GROUPS).</p>`;
    const tracked = sy.groups ? Object.values(sy.groups).filter((v) => v === "ok").length : getChildren(d).filter((k) => k.wa).length;

    const recv = st ? ` · odebrano wiadomości: ${st.seen} (z treścią: ${st.text})${sy.unresolved > 0 ? `, nieodszyfrowane: ${sy.unresolved}` : ""}` : "";

      : `<div class="warnbox" style="margin-top:8px">Ostatnie odświeżenie grup (${esc(when)}) nie w pełni się udało: ${esc(sy.error || "nieznany błąd")}.${esc(recv)}</div>`;

  function whatsappCard(d) {

  function viewKalendarz(d) {
    const kids = getChildren(d);
    if (kids.length === 0) return `<div class="card"><p>Czekam na pierwszą synchronizację.</p></div>`;

    // terminy wszystkich dzieci pogrupowane po dniu (bez odfiltrowywania przeszłości)
    const byDay = new Map();
    for (const k of kids) {
      for (const ev of allEvents(k)) {
        if (!isoDate.test(ev.date || "")) continue;
        if (!byDay.has(ev.date)) byDay.set(ev.date, []);
        byDay.get(ev.date).push({ ev, k });
      }
    }

    // zadania (WhatsApp i zadania domowe) z terminem też trafiają do kalendarza
    const doneSet = loadDone();
    for (const t of todoItems(d)) {
      if (!t.due || doneSet.has(t.id)) continue;
      if (!byDay.has(t.due)) byDay.set(t.due, []);
      byDay.get(t.due).push({ todo: t, k: t.k });
    }

    const { y, m } = state.cal;
    const first = new Date(y, m, 1);
    const offset = (first.getDay() + 6) % 7; // poniedziałek = 0
    const dim = new Date(y, m + 1, 0).getDate();
    const total = Math.ceil((offset + dim) / 7) * 7;
    const today = todayISO();
    const title = first.toLocaleDateString("pl-PL", { month: "long", year: "numeric" });

    let cells = ["Pn", "Wt", "Śr", "Cz", "Pt", "So", "Nd"].map((n) => `<div class="cal-dow">${n}</div>`).join("");
    for (let i = 0; i < total; i++) {
      const dt = new Date(y, m, 1 - offset + i);
      const iso = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
      const items = byDay.get(iso) || [];
      const idxs = [...new Set(items.map((x) => x.k.idx))].slice(0, 3);
      const cls = ["cal-day", dt.getMonth() !== m ? "off" : "", iso === today ? "today" : "", iso === state.calDay ? "sel" : ""].filter(Boolean).join(" ");
      const label = `${dt.toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" })}${items.length ? ", terminów: " + items.length : ""}`;
      cells += `<button class="${cls}" data-day="${iso}" aria-label="${esc(label)}">${dt.getDate()}<span class="dots">${idxs.map((ix) => `<i class="dot-c c${ix}"></i>`).join("")}</span></button>`;
    }

    const timeOf = (x) => (x.ev ? x.ev.time || "" : "99:99");
    const list = (byDay.get(state.calDay) || []).slice().sort((a, b) => timeOf(a).localeCompare(timeOf(b)));
    const [sy, sm, sd] = state.calDay.split("-").map(Number);

  // Ikony: w kolejnej paczce zostaną zastąpione zestawem SVG; na razie emotikony.
  const ICONS = { star: "⭐" };

  // ---------- oceny: średnie, wykres ----------
  const MONTHS = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
  const curSem = () => { const m = new Date().getMonth() + 1; return m >= 2 && m <= 8 ? 2 : 1; };
  const gradesOf = (c) => arr(c.extra?.gradeList);
  const inScope = (g, sem) => sem === "all" || g.sem === 0 || g.sem === (sem === "cur" ? curSem() : Number(sem));
  // Do średniej liczą się oceny z cyfrą (także 4+ i 3-). Samo "+" lub "-" (bez cyfry), "np", "bz" i "nb" nie mają wartości liczbowej, więc się nie liczą.
  const countable = (g) => !g.final && g.inAvg !== false && g.num != null;
  const fmtAvg = (v) => (v == null ? "–" : v.toFixed(2).replace(".", ","));
  const gcls = (g) => (g.base >= 5 ? "g5" : g.base === 4 ? "g4" : g.base === 3 ? "g3" : g.base ? "g2" : "g0");
  const avgCls = (v) => (v == null ? "g0" : v >= 4.75 ? "g5" : v >= 3.75 ? "g4" : v >= 2.75 ? "g3" : "g2");

  function wavg(list) {
    let sw = 0, sum = 0;
    for (const g of list) {
      if (!countable(g)) continue;
      const w = g.weight || 1;
      sw += w; sum += g.num * w;
    }
    return sw ? sum / sw : null;
  }
  function bySubject(list) {
    const m = new Map();
    for (const g of list) { if (!m.has(g.subject)) m.set(g.subject, []); m.get(g.subject).push(g); }
    return m;
  }
  // średnia ze średnich przedmiotów, uwzględniająca oceny do wskazanej daty
  function overallAt(list, iso) {
    const avgs = [...bySubject(list.filter((g) => g.date && g.date <= iso)).values()].map(wavg).filter((v) => v != null);
    return avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : null;
  }
  function overallSeries(list) {
    const dates = [...new Set(list.filter((g) => countable(g) && g.date).map((g) => g.date))].sort();
    return dates.map((date) => ({ date, v: overallAt(list, date) })).filter((p) => p.v != null);
  }
  const recentGrades = (list, days) => list.filter((g) => !g.final && g.date && g.date >= shiftISO(todayISO(), -days));

  function gradeChip(g, extraCls = "") {
    const title = [g.category, g.date && fmtDate(g.date), g.weight && `waga ${g.weight}`].filter(Boolean).join(" · ");
    return `<i class="gc ${gcls(g)}${g.final ? " fin" : ""} ${extraCls}" title="${esc(title)}">${g.final ? "★ " : ""}${esc(g.value)}</i>`;
  }
  const trendArrow = (delta) => (delta == null || Math.abs(delta) < 0.05 ? "" : delta > 0 ? `<span class="delta up" aria-label="rośnie">▲</span>` : `<span class="delta down" aria-label="spada">▼</span>`);

  function gradeChart(series, label) {
    if (series.length === 0) return `<p class="empty">Brak ocen liczonych do średniej w tym okresie.</p>`;
    const W = 360, H = 150, L = 28, R = 14, T = 16, B = 24;
    const ts = series.map((p) => Date.parse(p.date + "T12:00:00"));
    const tMin = ts[0], tMax = ts[ts.length - 1];
    const vals = series.map((p) => p.v);
    let lo = Math.max(1, Math.floor(Math.min(...vals) - 0.4));
    let hi = Math.min(6, Math.max(Math.ceil(Math.max(...vals) + 0.4), lo + 1));
    const x = (t) => (tMax === tMin ? (L + W - R) / 2 : L + ((t - tMin) / (tMax - tMin)) * (W - L - R));
    const y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
    let grid = "";
    for (let g = lo; g <= hi; g++) grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text class="lbl" x="${L - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
    const pts = series.map((p, i) => `${x(ts[i]).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const dots = series.map((p, i) => `<circle class="pt${i === series.length - 1 ? " last" : ""}" cx="${x(ts[i]).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === series.length - 1 ? 5 : 3}"/>`).join("");
    const lastX = x(ts[ts.length - 1]), lastY = y(vals[vals.length - 1]);
    // etykiety osi X: początki miesięcy (albo pierwsza i ostatnia data, gdy zakres jest krótki)
    let xl = "";
    const d0 = new Date(tMin), d1 = new Date(tMax);
    const months = [];
    for (let d = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); d <= d1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(d);
    if (months.length >= 1) {
      const step = Math.ceil(months.length / 6);
      months.forEach((d, i) => { if (i % step === 0) xl += `<text class="lbl" x="${x(d.getTime())}" y="${H - 6}" text-anchor="middle">${MONTHS[d.getMonth()]}</text>`; });
    } else {
      const f = (d) => `${d.getDate()}.${pad(d.getMonth() + 1)}`;
      xl = `<text class="lbl" x="${x(tMin)}" y="${H - 6}" text-anchor="${tMin === tMax ? "middle" : "start"}">${f(d0)}</text>` + (tMax !== tMin ? `<text class="lbl" x="${x(tMax)}" y="${H - 6}" text-anchor="end">${f(d1)}</text>` : "");
    }
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}<polyline class="line" points="${pts}"/>${dots}<text class="val" x="${Math.min(lastX, W - 18)}" y="${Math.max(lastY - 9, 11)}" text-anchor="middle">${fmtAvg(vals[vals.length - 1])}</text>${xl}</svg>`;
  }

  const relDay = (iso) => {
    if (!iso) return "";
    const t = todayISO();
    return iso === t ? "dziś" : iso === shiftISO(t, -1) ? "wczoraj" : fmtDate(iso);
  };

  function gradesSection(c) {
    if (!c.extra?.gradeList) return "";
    const all = gradesOf(c);
    const eff = state.gradeSem === "cur" ? String(curSem()) : state.gradeSem;
    const scoped = all.filter((g) => inScope(g, state.gradeSem));
    const today = todayISO();
    const series = overallSeries(scoped);
    const cur = overallAt(scoped, today);
    const prev = overallAt(scoped, shiftISO(today, -30));
    const delta = cur != null && prev != null ? cur - prev : null;
    const fresh = recentGrades(all, 7).sort((a, b) => b.date.localeCompare(a.date));

    const subjects = [...bySubject(scoped).entries()].sort((a, b) => a[0].localeCompare(b[0], "pl")).map(([name, list]) => {
      const avg = wavg(list);
      const before = wavg(list.filter((g) => g.date && g.date <= shiftISO(today, -30)));
      const shown = list.slice(-10);
      const chips = (list.length > shown.length ? `<span class="sub">+${list.length - shown.length}</span>` : "") +
        shown.map((g) => gradeChip(g, g.date && g.date >= shiftISO(today, -7) && !g.final ? "new" : "")).join("");
      const counted = list.filter(countable), skipped = list.filter((g) => !countable(g));
      const dec = (v) => String(v).replace(".", ",");
      const calc = counted.length
        ? `Średnia = (${counted.slice(0, 12).map((g) => `${dec(g.num)}×${g.weight || 1}`).join(" + ")}${counted.length > 12 ? " + …" : ""}) ÷ ${counted.reduce((a, g) => a + (g.weight || 1), 0)} = ${fmtAvg(avg)}`
        : "Brak ocen liczonych do średniej.";
      const calcHtml = `<p class="calc">${calc}${skipped.length ? ` Nie liczą się: ${skipped.map((g) => esc(g.final ? `${g.value} (końcowa)` : g.inAvg === false ? `${g.value} (poza średnią)` : g.value)).join(", ")}.` : ""}</p>`;
      const rows = list.slice().sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))).map((g) => `<li>
        ${gradeChip(g)}<div class="main"><b>${esc(g.category || (g.final ? "Ocena końcowa" : "Ocena"))}</b>
        <small>${fmtDate(g.date)}${g.weight ? ` · waga ${g.weight}` : ""}${g.inAvg === false ? " · nie liczy się do średniej" : ""}${g.teacher ? " · " + esc(g.teacher) : ""}${g.comment ? "<br>" + esc(g.comment) : ""}</small></div></li>`).join("");
      return `<details class="subj"><summary><span class="sn">${esc(name)}</span><span class="sa"><span class="avgpill ${avgCls(avg)}">${fmtAvg(avg)}</span><span class="ta">${trendArrow(avg != null && before != null ? avg - before : null)}</span></span><span class="sg">${chips}</span></summary>${calcHtml}<ul class="rows">${rows}</ul></details>`;
    }).join("");

    const seg = [["1", "Semestr I"], ["2", "Semestr II"], ["all", "Cały rok"]]
      .map(([k, l]) => `<button data-gsem="${k}" class="${eff === k ? "on" : ""}" aria-pressed="${eff === k}">${l}</button>`).join("");
    const deltaHtml = delta == null || Math.abs(delta) < 0.005 ? "" : `<div class="delta ${delta > 0 ? "up" : "down"}">${delta > 0 ? "▲" : "▼"} ${fmtAvg(Math.abs(delta))} w 30 dni</div>`;

    const freshHtml = fresh.length
      ? `<div class="sub-hd">Nowe oceny · 7 dni</div><ul class="rows newg">${fresh.slice(0, 6).map((g) => `<li>${gradeChip(g)}<div class="main"><b>${esc(g.subject)}</b><small>${esc(relDay(g.date))}${g.category ? " · " + esc(g.category) : ""}</small></div></li>`).join("")}</ul>${fresh.length > 6 ? `<p class="empty">i ${fresh.length - 6} więcej — poniżej przy przedmiotach</p>` : ""}`
      : "";

    return `<div class="card">
      <div class="avg-head"><div><h3>${icon("star")} Oceny</h3><small>średnia z ${[...bySubject(scoped.filter((g) => g.date && g.date <= today)).values()].filter((l) => wavg(l) != null).length} przedmiotów</small></div>
        <div style="text-align:right"><div class="big">${fmtAvg(cur)}</div>${deltaHtml}</div></div>
      <div class="seg">${seg}</div>
      ${freshHtml}
      <div class="sub-hd">Średnia w czasie</div>
      ${gradeChart(series, `Wykres średniej: ${series.length ? fmtAvg(series[series.length - 1].v) : "brak danych"}`)}
      <div class="sub-hd">Przedmioty</div>
      ${subjects || `<p class="empty">Brak ocen w wybranym okresie.</p>`}
    </div>`;
  }

  // ---------- zadania, plan lekcji, "Dziś i jutro" ----------
  const shiftISO = (iso, n) => {
    const [y, m, dd] = iso.split("-").map(Number);
    const t = new Date(y, m - 1, dd + n);
    return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  };
  const longDate = (iso) => {
    const [y, m, dd] = iso.split("-").map(Number);
    return new Date(y, m - 1, dd).toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" });
  };
  // Odhaczone zadania: źródłem prawdy jest Firestore (users/{uid}/prefs/state), a gdy reguły
  // tego nie pozwalają — pamięć przeglądarki.
  let remoteDone = null;
  let prefsWarned = false;
  function localDone() {
    try { return new Set(JSON.parse(localStorage.getItem("libapp_done") || "[]")); } catch { return new Set(); }
  }
  const prefsRef = () => (auth.currentUser ? doc(db, "users", auth.currentUser.uid, "prefs", "state") : null);
  function pushDone(ids) {
    const ref = prefsRef();
    if (!ref) return;
    setDoc(ref, { done: ids, updatedAt: Date.now() }, { merge: true }).catch(() => {
      state.prefs = "error";
      remoteDone = null;
      if (!prefsWarned) { prefsWarned = true; toast("Nie udało się zapisać odhaczeń w chmurze. Zaktualizuj reguły Firestore.", true); }
      render();
    });
  }
  function loadDone() { return remoteDone ?? localDone(); }
  function saveDone(set) {
    const ids = [...set].slice(-400);
    try { localStorage.setItem("libapp_done", JSON.stringify(ids)); } catch {}
    remoteDone = new Set(ids);
    pushDone(ids);
  }

  // Wszystko "do zrobienia": zadania wykryte w grupach WhatsApp + zadania domowe z Librusa.
  function todoItems(d) {
    const items = [];
    for (const k of getChildren(d)) {
      const saved = d?.whatsapp?.todos?.[k.key];
      const fromWa = Array.isArray(saved)
        ? saved
        : waRecent(k, 72).flatMap((e) => arr(e.todo)).map((t) => ({
            id: "t" + cyrb53(`${t.text}|${t.due || ""}`).toString(32), text: t.text, due: isoDate.test(t.due || "") ? t.due : null,
          }));
      for (const t of fromWa) items.push({ id: `${k.key}:${t.id}`, kind: "wa", text: t.text, due: t.due || null, k });
      for (const h of arr(k.extra?.homework)) {
        items.push({
          id: `${k.key}:hw:${cyrb53(`${h.subject}|${h.title}|${h.to}`).toString(32)}`,
          kind: "hw",
          text: `${h.subject ? h.subject + ": " : ""}${h.title}`,
          due: isoDate.test(h.to || "") ? h.to : null,
          k,
        });
      }
    }
    return items;
  }

  function todoRow(t, isDone, overdue) {
    return `<li>
      <button class="check c${t.k.idx}" data-done="${esc(t.id)}" aria-label="${isDone ? "Cofnij" : "Oznacz jako zrobione"}">${isDone ? "☑" : "☐"}</button>
      <div class="main"><b>${isDone ? `<s>${esc(t.text)}</s>` : esc(t.text)}</b>
        <small><span class="tag c${t.k.idx}">${esc(t.k.name)}</span>${overdue ? `<span class="od">po terminie</span> · ` : ""}${t.kind === "hw" ? "zadanie domowe" : "WhatsApp"}${t.due ? " · " + fmtDate(t.due) : ""}</small></div>
    </li>`;
  }

  function lessonsList(lessons) {
    return `<ul class="lessons">${lessons.map((l) => `<li><span class="nr">${esc(l.nr)}</span>
      <div class="main"><b>${esc(l.title)}</b><small>${esc(l.time)}${l.flag ? `${l.time ? " · " : ""}<span class="flag">${esc(l.flag)}</span>` : ""}</small></div></li>`).join("")}</ul>`;
  }

  function dayCard(d, iso, label) {
    const kids = getChildren(d);
    const done = loadDone();
    const today = todayISO();
    const items = todoItems(d).filter((t) => !done.has(t.id));
    const overdue = iso === today ? items.filter((t) => t.due && t.due < iso) : [];
    const todos = items.filter((t) => t.due === iso);
    const events = kids
      .flatMap((k) => allEvents(k).filter((e) => e.date === iso).map((ev) => ({ ev, k })))
      .sort((a, b) => (a.ev.time || "").localeCompare(b.ev.time || ""));
    const plans = kids
      .map((k) => ({ k, lessons: arr(k.extra?.timetable).find((x) => x.date === iso)?.lessons || [] }))
      .filter((p) => p.lessons.length);
    const lucky = iso === today ? kids.filter((k) => k.extra?.luckyNumber != null) : [];

    const rows = [
      ...overdue.map((t) => todoRow(t, false, true)),
      ...events.map(({ ev, k }) => eventRow(ev, k, true)),
      ...todos.map((t) => todoRow(t, false, false)),
    ].join("");
    const planHtml = plans.map(({ k, lessons }) => {
      const first = lessons[0]?.time?.split("-")[0], last = lessons[lessons.length - 1]?.time?.split("-")[1];
      return `<details class="plan c${k.idx}"><summary><span class="tag c${k.idx}">${esc(k.name)}</span>Plan lekcji · ${lessons.length}${first && last ? ` · ${esc(first)}–${esc(last)}` : ""}</summary>${lessonsList(lessons)}</details>`;
    }).join("");
    const luckyHtml = lucky.length ? `<p class="lucky">🍀 Szczęśliwy numerek: ${lucky.map((k) => `${esc(k.name)} ${esc(k.extra.luckyNumber)}`).join(", ")}</p>` : "";

    const body = rows || planHtml || luckyHtml
      ? `${rows ? `<ul class="rows">${rows}</ul>` : `<p class="empty">Brak terminów i zadań.</p>`}${planHtml}${luckyHtml}`
      : `<p class="empty">Nic zaplanowanego.</p>`;
    return `<h2 class="sec">${esc(label)} · ${esc(longDate(iso))}</h2><div class="card">${body}</div>`;
  }

  function viewTodo(d) {
    const kids = getChildren(d);
    if (kids.length === 0) return `<div class="card"><p>Czekam na pierwszą synchronizację.</p></div>`;
    const done = loadDone();
    const today = todayISO(), tomorrow = shiftISO(today, 1), weekEnd = shiftISO(today, 7);
    const all = todoItems(d).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.k.idx - b.k.idx);
    const open = all.filter((t) => !done.has(t.id));
    const closed = all.filter((t) => done.has(t.id));
    const groups = [
      ["Po terminie", open.filter((t) => t.due && t.due < today), true],
      ["Dziś", open.filter((t) => t.due === today), false],
      ["Jutro", open.filter((t) => t.due === tomorrow), false],
      ["W tym tygodniu", open.filter((t) => t.due && t.due > tomorrow && t.due <= weekEnd), false],
      ["Później", open.filter((t) => t.due && t.due > weekEnd), false],
      ["Bez terminu", open.filter((t) => !t.due), false],
    ].filter(([, list]) => list.length);

    const html = groups.map(([title, list, over]) => `<h2 class="sec">${title} · ${list.length}</h2>
      <div class="card"><ul class="rows">${list.map((t) => todoRow(t, false, over)).join("")}</ul></div>`).join("");
    const closedHtml = closed.length
      ? `<details class="card plan"><summary>Zrobione · ${closed.length}</summary><ul class="rows">${closed.map((t) => todoRow(t, true, false)).join("")}</ul></details>`
      : "";
    return `${html || `<div class="card"><p class="empty">Nic do zrobienia. Zadania z grup WhatsApp i zadania domowe z Librusa pojawią się tutaj.</p></div>`}${closedHtml}
      <p class="empty" style="margin-top:12px">${state.prefs === "ok" ? "Odhaczone zadania synchronizują się między Twoimi urządzeniami." : state.prefs === "error" ? "Synchronizacja odhaczeń jest wyłączona (reguły Firestore nie pozwalają na zapis). Odhaczenia zapamiętuje ta przeglądarka." : ""}</p>`;
  }

  // Zadania domowe i plan lekcji w widoku dziecka.
  function extraSections(c, d) {
    if (!c.extra) return "";
    const done = loadDone();
    const today = todayISO();
    const hw = todoItems(d)
      .filter((t) => t.kind === "hw" && t.k.key === c.key)
      .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    const hwBody = hw.map((t) => todoRow(t, done.has(t.id), !done.has(t.id) && t.due && t.due < today)).join("");
    const days = arr(c.extra.timetable).filter((x) => x.date >= today).slice(0, 3);
    const planBody = days.map((x, i) => `<details class="plan" ${i === 0 ? "open" : ""}><summary class="cap1">${esc(longDate(x.date))} · ${x.lessons.length} lekcji</summary>${lessonsList(x.lessons)}</details>`).join("");
    return `${section("📝", "Zadania domowe", hw.length, hwBody, "Brak zadań domowych w najbliższych tygodniach.")}
      <div class="card"><div class="sect-title"><h3>🎒 Plan lekcji</h3></div>${days.length ? planBody : `<p class="empty">Brak planu na najbliższe dni.</p>`}</div>`;
  }

  // Średnia i ostatnie oceny na kaflu dziecka (pulpit).
  function gradeStrip(k) {
    const all = gradesOf(k);
    if (!all.length) return "";
    const today = todayISO();
    const scoped = all.filter((g) => inScope(g, "cur"));
    const avg = overallAt(scoped, today);
    const prev = overallAt(scoped, shiftISO(today, -30));
    const latest = recentGrades(all, 7).sort((a, b) => b.date.localeCompare(a.date));
    const rows = latest.slice(0, 3).map((g) => `<div class="tg-row"><span class="n">${esc(g.subject)}</span>${gradeChip(g)}<span class="d">${esc(relDay(g.date))}</span></div>`).join("");
    const more = latest.length > 3 ? `<div class="tg-row"><span class="d">i ${latest.length - 3} więcej nowych ocen</span></div>` : "";
    return `<div class="tile-grades c${k.idx}">
      ${avg != null ? `<span class="avgbadge">śr. ${fmtAvg(avg)} ${prev != null ? trendArrow(avg - prev) : ""}</span>` : ""}
      ${rows}${more}
    </div>`;
  }

  function viewPulpit(d) {
    const kids = getChildren(d);
    if (kids.length === 0) {
      return `<div class="card"><p>Czekam na pierwszą synchronizację.</p></div>${whatsappCard(d)}`;
    }
    const all = kids.map((k) => ({ k, s: sec(k) }));
    const events = all
      .flatMap(({ k, s }) => s.events.map((ev) => ({ ev, k })))
      .filter(({ ev }) => ev.date > shiftISO(todayISO(), 1))
      .sort((a, b) => (a.ev.date + (a.ev.time || "")).localeCompare(b.ev.date + (b.ev.time || "")))
      .slice(0, 8);


    const tiles = all.map(({ k, s }) => `
      <button class="tile c${k.idx}" data-goto="${esc(k.key)}">
        <div class="tile-head"><span class="avatar">${esc((k.name || "?").charAt(0).toUpperCase())}</span><strong>${esc(k.name)}</strong><span class="chev" aria-hidden="true">›</span></div>
        ${k.lastError ? `<p class="sum" style="color:var(--warn)">⚠ Nie udało się odświeżyć: ${esc(k.lastError)}</p>` : ""}
        <p class="sum">${esc(k.summary || "Brak istotnych nowości.")}</p>
        ${gradeStrip(k)}
        <div class="counts"><span>⭐ ${gradesOf(k).length ? recentGrades(gradesOf(k), 7).length : s.grades.length}</span><span>⚠️ ${s.remarks.length}</span><span>✉️ ${s.messages.length}</span><span>📅 ${s.events.length}</span>${k.wa ? `<span>💬 ${waRecent(k, 24).reduce((n, e) => n + (e.messageCount || 0), 0)}</span>` : ""}</div>
      </button>`).join("");

    const evCard = events.length
      ? `<h2 class="sec">Dalsze terminy</h2><div class="card"><ul class="rows">${events.map(({ ev, k }) => eventRow(ev, k, true)).join("")}</ul></div>`
      : "";

    const today = todayISO();
    return `${dayCard(d, today, "Dziś")}${dayCard(d, shiftISO(today, 1), "Jutro")}<h2 class="sec">Dzieci</h2>${tiles}${evCard}
      ${whatsappCard(d)}
      <button id="logout-btn" class="btn btn-quiet">Wyloguj</button>`;
  }

  function section(icon, title, count, body, emptyText, badgeText) {
    return `<div class="card">
      <div class="sect-title"><h3>${icon} ${title}</h3>${count > 0 ? `<span class="badge">${badgeText || count}</span>` : ""}</div>
      ${count > 0 ? `<ul class="rows">${body}</ul>` : `<p class="empty">${emptyText}</p>`}
    </div>`;
  }

  function whatsappSection(c, d) {
    const title = `<h3>💬 WhatsApp${c.wa?.groupName ? ` <span class="sub">· ${esc(c.wa.groupName)}</span>` : ""}</h3>`;
    if (!c.wa) {
      const st = d?.whatsapp?.sync?.groups?.[c.key];
      const text = st === "ok" ? "Grupa jest podłączona i śledzona. Nie było jeszcze nowych wiadomości do streszczenia."
        : st === "not_found" ? "Nie znaleziono grupy o nazwie z sekretu WHATSAPP_GROUPS. Porównaj nazwę z listą grup na karcie WhatsApp na pulpicie."
        : st === "error" ? "Nie udało się streścić wiadomości z grupy. Spróbuję przy następnej synchronizacji."
        : "Grupa nie jest jeszcze podłączona albo czeka na pierwszą synchronizację.";
      return `<div class="card"><div class="sect-title">${title}</div><p class="empty">${text}</p></div>`;
    }
    const entries = waRecent(c, 48).sort((a, b) => b.atMs - a.atMs);
    const dayName = (ms) => {
      const d = new Date(ms), n = new Date();
      const same = (a, b) => a.toDateString() === b.toDateString();
      const y = new Date(n); y.setDate(n.getDate() - 1);
      const hm = d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" });
      return same(d, n) ? `dziś ${hm}` : same(d, y) ? `wczoraj ${hm}` : `${d.toLocaleDateString("pl-PL", { day: "numeric", month: "short" })} ${hm}`;
    };
    const body = entries.map((e) => {
      const hl = arr(e.highlights), todo = arr(e.todo);
      return `<div class="wa-entry"><small>${esc(dayName(e.atMs))} · ${e.messageCount || 0} wiad.</small>
        <p>${esc(e.summary || "Brak istotnych informacji.")}</p>
        ${hl.length ? `<ul class="wa-list">${hl.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
        ${todo.length ? `<div class="wa-h">Do zrobienia</div><ul class="wa-list todo">${todo.map((t) => `<li>${esc(t.text)}${t.due ? ` <span class="sub">(do ${fmtDate(t.due)})</span>` : ""}</li>`).join("")}</ul>` : ""}
      </div>`;
    }).join("");
    return `<div class="card"><div class="sect-title">${title}${entries.length ? `<span class="badge">${entries.length}</span>` : ""}</div>
      ${entries.length ? body : `<p class="empty">Brak nowych wiadomości w grupie z ostatnich 48 godzin.</p>`}</div>`;
  }

  function viewChild(d, key) {
    const c = getChildren(d).find((k) => k.key === key);
    if (!c) return `<div class="card"><p>Nie ma danych dla tego dziecka.</p></div>`;
    const s = sec(c);
    const hasSections = !!c.sections;

    const grades = s.grades.map((g) => `<li><span class="grade">${esc(g.grade)}</span>
      <div class="main"><b>${esc(g.subject)}</b><small>${fmtDate(g.date)}${g.note ? (g.date ? " · " : "") + esc(g.note) : ""}</small></div></li>`).join("");

    const remarks = s.remarks.map((r) => {
      const t = (r.type || "").toLowerCase();
      const cls = t.startsWith("neg") ? "neg" : t.startsWith("poz") ? "pos" : "";
      return `<li><div class="main"><b>${esc(r.text)}</b><small>${esc(r.teacher)}${r.teacher && r.date ? " · " : ""}${fmtDate(r.date)}</small></div>${r.type ? `<span class="chip ${cls}">${esc(r.type)}</span>` : ""}</li>`;
    }).join("");

    const unread = s.messages.filter((m) => m.unread).length;
    const messages = s.messages.map((m) => `<li><span class="${m.unread ? "unread" : "read"}" aria-label="${m.unread ? "nieprzeczytana" : "przeczytana"}"></span>
      <div class="main"><b>${esc(m.subject)}</b><small>${esc(m.from)}${m.from && m.date ? " · " : ""}${esc(m.date || "")}</small></div>
      ${m.kind === "ogłoszenie" ? `<span class="chip">ogłoszenie</span>` : ""}</li>`).join("");

    const events = s.events.map((ev) => eventRow(ev, c, false)).join("");

    return `<div class="c${c.idx}">
      <div class="child-head"><span class="avatar">${esc((c.name || "?").charAt(0).toUpperCase())}</span>
        <div><h2>${esc(c.name)}</h2><small>${c.updatedAt ? "Zaktualizowano " + fmtStamp(c.updatedAt) : ""}${c.extra?.luckyNumber != null ? ` · 🍀 numerek ${esc(c.extra.luckyNumber)}` : ""}</small></div></div>
      ${c.lastError ? `<div class="warnbox">Ostatnie odświeżenie się nie udało: ${esc(c.lastError)}. Widać dane z poprzedniej synchronizacji.</div>` : ""}
      ${c.summary ? `<div class="card"><p class="sum" style="margin:0">${esc(c.summary)}</p></div>` : ""}
      ${hasSections ? `
        ${c.extra?.gradeList ? gradesSection(c) : section("⭐", "Oceny", s.grades.length, grades, "Brak nowych ocen z ostatnich 7 dni.", `${s.grades.length} nowe`)}
        ${section("⚠️", "Uwagi", s.remarks.length, remarks, "Brak nowych uwag z ostatnich 7 dni.")}
        ${section("📅", "Wydarzenia", s.events.length, events, "Brak nadchodzących wydarzeń w ciągu 60 dni.")}
        ${section("✉️", "Wiadomości", s.messages.length, messages, "Brak nowych wiadomości z ostatnich 7 dni.", unread ? `${unread} nieprzeczytane` : `${s.messages.length}`)}
      ` : `<div class="card"><p class="empty">Szczegóły pojawią się po następnej synchronizacji.</p></div>`}
      ${extraSections(c, d)}
      ${whatsappSection(c, d)}
    </div>`;
  }

  function render() {
    const d = state.data;
    const kids = getChildren(d);
    if (!["pulpit", "kalendarz", "todo"].includes(state.view) && !kids.some((k) => k.key === state.view)) state.view = "pulpit";
    registry.clear();
    $("#content").innerHTML = state.view === "pulpit" ? viewPulpit(d) : state.view === "kalendarz" ? viewKalendarz(d) : state.view === "todo" ? viewTodo(d) : viewChild(d, state.view);
    const doneNow = loadDone();
    const dueNow = todoItems(d).filter((t) => !doneNow.has(t.id) && t.due && t.due <= todayISO()).length;

    $("#nav").innerHTML = `
      <button data-goto="pulpit" ${state.view === "pulpit" ? 'aria-current="page"' : ""}><span class="ico" aria-hidden="true">🏠</span>Pulpit</button>
      <button data-goto="kalendarz" ${state.view === "kalendarz" ? 'aria-current="page"' : ""}><span class="ico" aria-hidden="true">📅</span>Kalendarz</button>
      <button data-goto="todo" ${state.view === "todo" ? 'aria-current="page"' : ""}><span class="ico" aria-hidden="true">✅</span>Do zrobienia${dueNow ? `<span class="nb" aria-label="${dueNow} na dziś lub po terminie">${dueNow}</span>` : ""}</button>
      ${kids.map((k) => `<button class="c${k.idx}" data-goto="${esc(k.key)}" ${state.view === k.key ? 'aria-current="page"' : ""}><span class="ico av" aria-hidden="true">${esc((k.name || "?").charAt(0).toUpperCase())}</span>${esc(k.name)}</button>`).join("")}`;

    const dot = $("#sync-dot"), text = $("#sync-text");
    if (d?.lastSync) {
      const time = fmtStamp(d.lastSync.timestamp);
      if (d.lastSync.status === "ok") { dot.className = "dot ok"; text.textContent = `Ostatnia synchronizacja: ${time}`; }
      else { dot.className = "dot error"; text.textContent = `Błąd synchronizacji (${time}): ${d.lastSync.error ?? ""}`; }
    }
  }

  // ---------- kalendarz Google ----------
  let calToken = { value: null, exp: 0 };
  async function getToken(force = false) {
    if (!force && calToken.value && Date.now() < calToken.exp) return calToken.value;
    const p = new GoogleAuthProvider();
    p.addScope(CAL_SCOPE);
    if (auth.currentUser?.email) p.setCustomParameters({ login_hint: auth.currentUser.email });
    const result = await reauthenticateWithPopup(auth.currentUser, p);
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (!cred?.accessToken) throw new Error("Google nie zwrócił zgody na kalendarz.");
    calToken = { value: cred.accessToken, exp: Date.now() + 50 * 60 * 1000 };
    return calToken.value;
  }

  // Przypomnienia: dla terminu z godziną — dzień wcześniej o 18:00 i godzinę przed;
  // dla terminu bez godziny (całodniowy) — dzień wcześniej o 18:00.
  function buildEventBody({ ev, childName }, id) {
    const base = {
      id,
      summary: `${childName}: ${ev.title}`,
      description: ["Librus — " + childName, ev.sourceNote].filter(Boolean).join("\n"),
    };
    if (ev.time && /^\d{1,2}:\d{2}$/.test(ev.time)) {
      const [h, m] = ev.time.split(":").map(Number);
      const startMin = h * 60 + m;
      return {
        ...base,
        start: { dateTime: `${ev.date}T${pad(h)}:${pad(m)}:00`, timeZone: TZ },
        end: { dateTime: addMinutes(ev.date, `${pad(h)}:${pad(m)}`, 60), timeZone: TZ },
        reminders: { useDefault: false, overrides: [{ method: "popup", minutes: startMin + 360 }, { method: "popup", minutes: 60 }] },
      };
    }
    return {
      ...base,
      start: { date: ev.date },
      end: { date: addDays(ev.date, 1) },
      reminders: { useDefault: false, overrides: [{ method: "popup", minutes: 360 }] },
    };
  }

  const insertEvent = (body, token) => fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });

  function friendlyError(e) {
    const msg = String(e?.message || e);
    if (e?.code === "auth/popup-closed-by-user" || e?.code === "auth/cancelled-popup-request") return "Anulowano logowanie do Google.";
    if (e?.code === "auth/popup-blocked") return "Przeglądarka zablokowała okno logowania. Zezwól na wyskakujące okna i spróbuj ponownie.";
    if (/has not been used|accessNotConfigured|is disabled/i.test(msg)) return "Włącz Google Calendar API w projekcie Google Cloud, potem spróbuj ponownie.";
    return msg;
  }

  async function onAdd(id, btn) {
    const item = registry.get(id);
    if (!item) return;
    btn.disabled = true;
    btn.textContent = "Dodaję…";
    try {
      const body = buildEventBody(item, id);
      let token = await getToken();
      let res = await insertEvent(body, token);
      if (res.status === 401) { token = await getToken(true); res = await insertEvent(body, token); }
      if (res.ok) { markAdded(id); toast("Dodano do kalendarza."); }
      else if (res.status === 409) { markAdded(id); toast("Ten termin jest już w kalendarzu."); }
      else {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `Błąd ${res.status}`);
      }
      render();
    } catch (e) {
      toast(friendlyError(e), true);
      btn.disabled = false;
      btn.textContent = "📅 Dodaj";
    }
  }

  // ---------- zdarzenia ----------
  document.addEventListener("click", (e) => {
    const goto = e.target.closest("[data-goto]");
    if (goto) { state.view = goto.dataset.goto; render(); window.scrollTo(0, 0); return; }
    const gs = e.target.closest("[data-gsem]");
    if (gs) { state.gradeSem = gs.dataset.gsem; render(); return; }
    const dn = e.target.closest("[data-done]");
    if (dn) {
      const set = loadDone();
      const id = dn.dataset.done;
      if (set.has(id)) set.delete(id); else set.add(id);
      saveDone(set);
      render();
      return;
    }
    const day = e.target.closest("[data-day]");
    if (day) {
      const [yy, mm, dd] = day.dataset.day.split("-").map(Number);
      state.calDay = day.dataset.day;
      state.cal = { y: yy, m: mm - 1 };
      render();
      return;
    }
    const navBtn = e.target.closest("[data-calnav]");
    if (navBtn) {
      const t = new Date(state.cal.y, state.cal.m + Number(navBtn.dataset.calnav), 1);
      state.cal = { y: t.getFullYear(), m: t.getMonth() };
      render();
      return;
    }
    if (e.target.closest("[data-caltoday]")) {
      const n = new Date();
      state.cal = { y: n.getFullYear(), m: n.getMonth() };
      state.calDay = todayISO();
      render();
      return;
    }
    const add = e.target.closest("[data-add]");
    if (add) { onAdd(add.dataset.add, add); return; }
    if (e.target.closest("#logout-btn")) signOut(auth);
  });

  $("#login-btn").addEventListener("click", () => {
    signInWithPopup(auth, provider).catch((e) => alert("Błąd logowania: " + e.message));
  });

  let unsubscribe = null;
  let unsubPrefs = null;
  onAuthStateChanged(auth, (user) => {
    if (unsubscribe) unsubscribe();
    if (unsubPrefs) unsubPrefs();
    remoteDone = null;
    state.prefs = "pending";
    if (user) {
      $("#login-screen").style.display = "none";
      $("#app-screen").style.display = "block";
      $("#greeting").textContent = `Cześć, ${user.displayName?.split(" ")[0] || ""}!`;
      // user.uid musi być wpisany do scripts/users.config.json (firestoreUid)
      unsubscribe = onSnapshot(doc(db, "users", user.uid), (snap) => { state.data = snap.data() || null; render(); },
        (err) => { $("#sync-dot").className = "dot error"; $("#sync-text").textContent = "Brak dostępu do danych: " + err.message; });
      unsubPrefs = onSnapshot(doc(db, "users", user.uid, "prefs", "state"), (snap) => {
        state.prefs = "ok";
        if (snap.exists()) {
          remoteDone = new Set(arr(snap.data().done));
          try { localStorage.setItem("libapp_done", JSON.stringify([...remoteDone])); } catch {}
        } else {
          remoteDone = localDone(); // pierwsze połączenie: przenosimy odhaczenia z tej przeglądarki
          if (remoteDone.size) pushDone([...remoteDone]);
        }
        render();
      }, () => { state.prefs = "error"; remoteDone = null; render(); });
      render();
    } else {
      $("#login-screen").style.display = "block";
      $("#app-screen").style.display = "none";
      state.data = null; state.view = "pulpit";
    }
  });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
